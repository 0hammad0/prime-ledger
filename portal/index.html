<!doctype html>
<html lang="{{ lang }}" dir="{{ layout_direction }}">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0B2E24">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="{{ favicon or '/assets/erpnext/images/prime-ledger-favicon.svg' }}" type="image/x-icon">
  <title>Portal | {{ app_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.csrf_token = '{{ frappe.session.csrf_token }}';
    if (!window.frappe) window.frappe = {};
    frappe.boot = JSON.parse({{ boot }});
    frappe.boot.layout_direction = "{{ layout_direction }}";
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
